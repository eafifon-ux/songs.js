<style>
#gpc-songs, #gpc-songs * { box-sizing: border-box; }
#gpc-songs {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #2c3e50;
  line-height: 1.55;
  max-width: 780px;
  margin: 0 auto;
}
#gpc-songs h1 { font-weight: 300; font-size: 1.8rem; margin: 0 0 8px; text-align: center; }
#gpc-songs .subtitle { text-align: center; color: #666; margin-bottom: 18px; }
#gpc-songs .subtitle a { color: #3498db; text-decoration: none; }
#gpc-songs .today-card {
  background: #fff; border: 1px solid #e9ecef; border-radius: 12px;
  padding: 18px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
#gpc-songs .today-card h2 { font-weight: 400; margin: 0 0 6px; text-align: center; }
#gpc-songs .today-meta { color: #888; font-size: .9rem; margin-bottom: 10px; text-align: center; }
#gpc-songs .quote {
  font-size: 1.05rem; margin: 10px 0; padding: 10px 12px;
  background: #faf7f2; border-radius: 8px;
}
#gpc-songs .quote .q-hi { margin-top: 8px; }
#gpc-songs .quote .q-he { margin-top: 8px; direction: rtl; text-align: right; }
#gpc-songs .quote cite { display: block; margin-top: 6px; color: #888; font-size: .85rem; }
#gpc-songs .music-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 560px) { #gpc-songs .music-row { grid-template-columns: 1fr; } }
#gpc-songs .music-col { background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
#gpc-songs .music-col h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 600; }
#gpc-songs .play-links { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
#gpc-songs .play-links a {
  padding: 6px 12px; border-radius: 999px; background: #111; color: #fff;
  text-decoration: none; font-weight: 600; font-size: .82rem;
}
#gpc-songs iframe { width: 100%; height: 180px; border: 0; border-radius: 8px; }
#gpc-songs .jump {
  display: flex; gap: 8px; justify-content: center; align-items: center;
  margin: 12px 0 20px; flex-wrap: wrap;
}
#gpc-songs .jump input {
  width: 90px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
}
#gpc-songs .jump button {
  padding: 8px 14px; border: 0; border-radius: 8px; background: #3498db; color: #fff;
  font-weight: 700; cursor: pointer;
}
#gpc-songs .season-header {
  font-size: 1.15rem; font-weight: 600; margin: 22px 0 10px; padding: 10px 14px;
  border-radius: 8px; color: #fff; text-align: center;
}
#gpc-songs .season-header.q1 { background: linear-gradient(135deg, #27ae60, #2ecc71); }
#gpc-songs .season-header.q2 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
#gpc-songs .season-header.q3 { background: linear-gradient(135deg, #e67e22, #d35400); }
#gpc-songs .season-header.q4 { background: linear-gradient(135deg, #3498db, #2980b9); }
#gpc-songs .day {
  background: #fff; border: 1px solid #e9ecef; border-radius: 10px; margin-bottom: 8px; overflow: hidden;
}
#gpc-songs .day-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
#gpc-songs .day-head:hover { background: #f0f7ff; }
#gpc-songs .day.current .day-head { background: linear-gradient(90deg, rgba(243,156,18,.18), transparent); }
#gpc-songs .doy { font-size: .8rem; color: #999; min-width: 36px; }
#gpc-songs .day-title { font-weight: 600; flex: 1; }
#gpc-songs .chevron { margin-left: auto; color: #aaa; transition: transform .2s; }
#gpc-songs .day.open .chevron { transform: rotate(90deg); }
#gpc-songs .day-body { display: none; padding: 0 14px 14px 14px; background: #fafbfc; }
#gpc-songs .day.open .day-body { display: block; }
#gpc-songs .status { text-align: center; color: #888; padding: 20px; }
#gpc-songs .pending { color: #b36b00; font-style: italic; }
</style>

<div id="gpc-songs">
  <h1>Song of the Day</h1>
  <p class="subtitle">
    364 days · Hebrew + Hindi ·
    <a href="https://www.gpc364.com/2025/12/calendar_95.html?m=1">Calendar</a>
  </p>
  <div id="gpc-songs-today" class="today-card">Loading today’s song…</div>
  <div class="jump">
    <label for="gpc-songs-doy">Day</label>
    <input id="gpc-songs-doy" type="number" min="1" max="364" value="1">
    <button type="button" id="gpc-songs-go">Open</button>
  </div>
  <div id="gpc-songs-list" class="status">Loading the year of songs…</div>
</div>

<script>
(function () {
  var SONGS_SRC = [
    "https://cdn.jsdelivr.net/gh/eafifon-ux/songs.js/songs-q2.js",
    "https://cdn.jsdelivr.net/gh/eafifon-ux/songs.js/songs-q4.js",
    "https://cdn.jsdelivr.net/gh/eafifon-ux/songs.js/songs.js"
  ];
  var seasons = [
    { id: "q1", name: "Unspring / Duspring / Trispring", start: 1, end: 91 },
    { id: "q2", name: "Quadsum / Fivesum / Sixsum", start: 92, end: 182 },
    { id: "q3", name: "Sepafall / Oktafall / Novafall", start: 183, end: 273 },
    { id: "q4", name: "Dekawint / Elvawint / Dozawint", start: 274, end: 364 }
  ];

  function pad3(n) { return String(n).padStart(3, "0"); }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" })[c];
    });
  }
  function watchUrl(u) {
    if (!u) return "";
    u = String(u);
    if (u.indexOf("vnd.youtube://") === 0) {
      u = u.replace("vnd.youtube://", "https://www.youtube.com/");
    }
    return u;
  }
  function ytId(url) {
    url = watchUrl(url);
    if (!url) return "";
    var m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : "";
  }
  function embed(url) {
    var id = ytId(url);
    if (!id) return "";
    return '<iframe src="https://www.youtube.com/embed/' + id +
      '" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  }
  function links(video, lyrics, labelPlay) {
    var bits = [];
    video = watchUrl(video);
    if (video) bits.push('<a href="' + esc(video) + '" target="_blank" rel="noopener">' + labelPlay + "</a>");
    if (lyrics) bits.push('<a href="' + esc(lyrics) + '" target="_blank" rel="noopener">Lyrics</a>');
    return bits.length ? '<div class="play-links">' + bits.join("") + "</div>" : "";
  }
  function quoteHtml(song) {
    if (!song.quoteEn && !song.quoteHe && !song.quoteHi) return "";
    return '<div class="quote">' +
      (song.quoteEn ? "<div>" + esc(song.quoteEn) + "</div>" : "") +
      (song.quoteHi ? '<div class="q-hi">' + esc(song.quoteHi) + "</div>" : "") +
      (song.quoteHe ? '<div class="q-he">' + esc(song.quoteHe) + "</div>" : "") +
      (song.quoteBy ? "<cite>— " + esc(song.quoteBy) + "</cite>" : "") +
    "</div>";
  }
  function musicHtml(song) {
    var he = song.heVideo || song.youtube || "";
    var hi = song.hiVideo || song.spotify || "";
    return '<div class="music-row">' +
      '<div class="music-col"><h3>Hebrew</h3>' + embed(he) + links(he, song.heLyrics, "Video") + "</div>" +
      '<div class="music-col"><h3>Hindi</h3>' + embed(hi) + links(hi, song.hiLyrics, hi.indexOf("spotify") >= 0 ? "Spotify" : "Video") + "</div>" +
    "</div>";
  }
  function bodyHtml(song) {
    if (song.pending) return '<p class="pending">' + esc(song.pending) + "</p>";
    return quoteHtml(song) + musicHtml(song);
  }
  function titleOf(d, song) {
    if (song.title) return song.title;
    if (song.quoteEn) {
      var t = song.quoteEn.replace(/^["“]|["”]$/g, "");
      return t.length > 72 ? t.slice(0, 69) + "…" : t;
    }
    return song.pending ? "Pending" : "Day " + pad3(d);
  }
  function gpcDoyNow() {
    var epochUTC = Date.UTC(1982, 2, 24);
    var epochYear = 5979;
    var now = new Date();
    var days = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - epochUTC) / 86400000);
    var mod = function (a, b) { return ((a % b) + b) % b; };
    var leapWeeks = function (r) {
      var l = 0;
      if (mod(r, 7) >= 6) l += 7;
      if (mod(r, 49) >= 48) l += 7;
      if (mod(r + 29, 70) === 0) l += 7;
      return l;
    };
    var y = epochYear;
    if (days >= 0) {
      while (true) {
        var yearLen = 364 + leapWeeks(y - epochYear);
        if (days < yearLen) break;
        days -= yearLen;
        y++;
      }
    } else {
      while (days < 0) {
        y--;
        days += 364 + leapWeeks(y - epochYear);
      }
    }
    var doy = days + 1;
    if (doy > 364) doy = 364;
    return { year: y, doy: doy };
  }

  function render(songs) {
    var today = gpcDoyNow();
    var hash = (location.hash || "").replace("#", "");
    var hashDay = 0;
    var hm = hash.match(/^(?:day|ch|d)?(\d{1,3})$/i);
    if (hm) hashDay = parseInt(hm[1], 10);
    var openDay = (hashDay >= 1 && hashDay <= 364) ? hashDay : today.doy;
    var t = songs[today.doy] || {};
    document.getElementById("gpc-songs-today").innerHTML =
      "<h2>Day " + pad3(today.doy) + "</h2>" +
      '<div class="today-meta">GPC ' + today.year + " · " + esc(titleOf(today.doy, t)) + "</div>" +
      bodyHtml(t);
    document.getElementById("gpc-songs-doy").value = String(openDay);

    var html = "";
    seasons.forEach(function (s) {
      html += '<div class="season-header ' + s.id + '">' + s.name + " · " + pad3(s.start) + "–" + pad3(s.end) + "</div>";
      for (var d = s.start; d <= s.end; d++) {
        var song = songs[d] || {};
        html += '<div class="day' + (d === openDay ? " open" : "") + (d === today.doy ? " current" : "") + '" id="day' + d + '">' +
          '<div class="day-head" data-day="' + d + '">' +
            '<span class="doy">' + pad3(d) + "</span>" +
            '<span class="day-title">' + esc(titleOf(d, song)) + "</span>" +
            '<span class="chevron">▸</span>' +
          "</div>" +
          '<div class="day-body">' + bodyHtml(song) + "</div>" +
        "</div>";
      }
    });
    var list = document.getElementById("gpc-songs-list");
    list.innerHTML = html;
    list.addEventListener("click", function (e) {
      var head = e.target.closest(".day-head");
      if (!head) return;
      var day = document.getElementById("day" + head.getAttribute("data-day"));
      var was = day.classList.contains("open");
      list.querySelectorAll(".day.open").forEach(function (el) { el.classList.remove("open"); });
      if (!was) {
        day.classList.add("open");
        history.replaceState(null, "", "#day" + head.getAttribute("data-day"));
      }
    });
    var target = document.getElementById("day" + openDay);
    if (target) target.scrollIntoView({ block: "center" });
  }

  function goDay() {
    var n = parseInt(document.getElementById("gpc-songs-doy").value, 10);
    if (n >= 1 && n <= 364) {
      location.hash = "day" + n;
      var el = document.getElementById("day" + n);
      if (el) {
        document.querySelectorAll("#gpc-songs-list .day.open").forEach(function (d) { d.classList.remove("open"); });
        el.classList.add("open");
        el.scrollIntoView({ block: "center" });
      }
    }
  }
  document.getElementById("gpc-songs-go").addEventListener("click", goDay);
  document.getElementById("gpc-songs-doy").addEventListener("keydown", function (e) {
    if (e.key === "Enter") goDay();
  });

  function boot(songs) {
    window.GPC_SONGS = songs;
    window.SONGS = songs;
    render(songs);
  }

  function loadNext(i) {
    if (i >= SONGS_SRC.length) {
      boot(window.GPC_SONGS || window.SONGS || {});
      return;
    }
    var s = document.createElement("script");
    s.src = SONGS_SRC[i];
    s.onload = function () { loadNext(i + 1); };
    s.onerror = function () {
      document.getElementById("gpc-songs-today").textContent =
        "Could not load " + SONGS_SRC[i];
    };
    document.head.appendChild(s);
  }
  loadNext(0);
})();
</script>
